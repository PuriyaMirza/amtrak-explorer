<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Amtrak Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Where questions start when they don't name a station. Remembered in
       this browser; the server only trusts the stop_id after checking it. -->
  <div id="home-station" class="home-station">
    <span class="meta">Your station:</span>
    <button id="home-station-button" type="button" aria-expanded="false" aria-controls="home-station-picker"></button>
    <div id="home-station-picker" class="home-station-picker" hidden>
      <input id="home-station-input" type="text" placeholder="Type a station name…" autocomplete="off" aria-label="Search for your station" />
      <ul id="home-station-results"></ul>
    </div>
  </div>

  <h1>Amtrak Explorer</h1>
  <input id="q" type="text" placeholder="Search stations and routes…" autocomplete="off" />
  <div id="results"></div>

  <h2 class="ask-heading">Ask in plain English</h2>
  <form id="ask-form">
    <input id="ask-input" type="text" placeholder="e.g. what trains go through Chicago?" autocomplete="off" />
    <button id="ask-button" type="submit">Ask</button>
  </form>
  <div id="ask-results"></div>

  <script type="module">
    import { logEvent, deviceId, sessionId } from './events.js'
    import { formatToolCall } from './tool-labels.js'
    import { loadHomeStation, saveHomeStation, stationFromSearchRow } from './home-station.js'

    // ---- Home station picker ----
    // Click the station name, type, pick a result. Reuses /api/search (the
    // same query as the search box), keeping stations only.
    const homeButton = document.getElementById('home-station-button')
    const homePicker = document.getElementById('home-station-picker')
    const homeInput = document.getElementById('home-station-input')
    const homeResults = document.getElementById('home-station-results')
    const HOME_RESULT_LIMIT = 8

    let homeStation = loadHomeStation(localStorage)
    homeButton.textContent = homeStation.name

    function setPickerOpen(open) {
      homePicker.hidden = !open
      homeButton.setAttribute('aria-expanded', String(open))
      if (open) {
        homeInput.value = ''
        homeResults.replaceChildren()
        homeInput.focus()
      }
    }

    // One <li> per station, built with textContent rather than innerHTML, so
    // a station name can only ever be shown as text.
    function homeStatus(text) {
      const li = document.createElement('li')
      li.className = 'status'
      li.textContent = text
      homeResults.replaceChildren(li)
    }

    function renderHomeResults(stations) {
      if (!stations.length) return homeStatus('No matching stations.')
      homeResults.replaceChildren(...stations.slice(0, HOME_RESULT_LIMIT).map((row) => {
        const li = document.createElement('li')
        li.className = 'clickable'
        li.tabIndex = 0
        li.textContent = row.stop_name + ' '
        const meta = document.createElement('span')
        meta.className = 'meta'
        meta.textContent = row.stop_id
        li.append(meta)
        const choose = () => {
          homeStation = saveHomeStation(localStorage, stationFromSearchRow(row))
          homeButton.textContent = homeStation.name
          setPickerOpen(false)
          homeButton.focus()
          logEvent('home_station', {
            target_type: 'station',
            target_id: homeStation.stop_id,
            target_label: homeStation.name,
          })
        }
        li.addEventListener('click', choose)
        li.addEventListener('keydown', (e) => { if (e.key === 'Enter') choose() })
        return li
      }))
    }

    homeButton.addEventListener('click', () => setPickerOpen(homePicker.hidden))

    let homeTimer
    homeInput.addEventListener('input', () => {
      clearTimeout(homeTimer)
      const term = homeInput.value.trim()
      if (term.length < 2) return homeResults.replaceChildren()
      homeTimer = setTimeout(async () => {
        try {
          const res = await fetch(`/api/search?q=${encodeURIComponent(term)}`)
          if (!res.ok) throw new Error(`Search failed (${res.status})`)
          const data = await res.json()
          // Ignore a reply that arrives after the person kept typing.
          if (homeInput.value.trim() === term) renderHomeResults(data.stations)
        } catch (err) {
          homeStatus(`Error: ${err.message}`)
        }
      }, 250)
    })

    // Escape or a click elsewhere closes the picker without changing anything.
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !homePicker.hidden) {
        setPickerOpen(false)
        homeButton.focus()
      }
    })
    document.addEventListener('click', (e) => {
      if (!homePicker.hidden && !document.getElementById('home-station').contains(e.target)) setPickerOpen(false)
    })

    const input = document.getElementById('q')
    const results = document.getElementById('results')

    const MIN_CHARS = 2
    const DEBOUNCE_MS = 250

    // GTFS route_type: 2 = train, 3 = bus/thruway. Enough for a label.
    function routeKind(type) {
      if (type === 2) return 'train'
      if (type === 3) return 'bus'
      return `type ${type}`
    }

        function render({ stations, routes }, queryId) {
      const routeNames = [...new Set(routes.map(r => r.route_long_name))]

      const sections = []

      sections.push(`<h2>Stations (${stations.length})</h2>`)
      if (stations.length) {
        sections.push('<ul>' + stations.map((s, i) =>
          `<li class="clickable" data-query-id="${queryId}" data-group="station"
               data-id="${s.stop_id}" data-label="${s.stop_name}" data-position="${i}">
            ${s.stop_name} <span class="meta">${s.stop_id} · ${s.stop_timezone ?? ''}</span>
          </li>`
        ).join('') + '</ul>')
      } else {
        sections.push('<p class="status">No matching stations.</p>')
      }

      sections.push(`<h2>Routes (${routeNames.length})</h2>`)
      if (routeNames.length) {
        const kindByName = {}
        routes.forEach(r => { kindByName[r.route_long_name] ??= routeKind(r.route_type) })
        sections.push('<ul>' + routeNames.map((name, i) =>
          `<li class="clickable" data-query-id="${queryId}" data-group="route"
               data-id="${name}" data-label="${name}" data-position="${i}">
            ${name} <span class="meta">${kindByName[name]}</span>
          </li>`
        ).join('') + '</ul>')
      } else {
        sections.push('<p class="status">No matching routes.</p>')
      }

      results.innerHTML = sections.join('')
    }

    // Debounce: each keystroke resets the timer, so the query only fires
    // once the user pauses typing for DEBOUNCE_MS.
    let timer
    input.addEventListener('input', () => {
      clearTimeout(timer)
      const term = input.value.trim()

      if (term.length < MIN_CHARS) {
        results.innerHTML = `<p class="status">Type at least ${MIN_CHARS} characters…</p>`
        return
      }

            timer = setTimeout(async () => {
        results.innerHTML = '<p class="status">Searching…</p>'
        const queryId = crypto.randomUUID()
        try {
          const res = await fetch(`/api/search?q=${encodeURIComponent(term)}`)
          if (!res.ok) {
            const body = await res.json().catch(() => ({}))
            throw new Error(body.error || `Search failed (${res.status})`)
          }
          const data = await res.json()
          render(data, queryId)
          logEvent('search', {
            query_id: queryId,
            query_text: term,
            stop_count: data.stations.length,
            route_count: data.routes.length,
          })
        } catch (err) {
          results.innerHTML = `<p class="status">Error: ${err.message}</p>`
        }
      }, DEBOUNCE_MS)
    })

    results.addEventListener('click', (event) => {
      const item = event.target.closest('.clickable')
      if (!item) return

      logEvent('click', {
        query_id: item.dataset.queryId,
        target_type: item.dataset.group,
        target_id: item.dataset.id,
        target_label: item.dataset.label,
        result_position: Number(item.dataset.position),
        result_group: item.dataset.group,
      })
    })

    // ---- Natural-language ask ----
    // Posts the question to our own serverless function. That function holds
    // the secret API key and runs the real database query, so the model can
    // only ever describe rows that actually came back.
    const askForm = document.getElementById('ask-form')
    const askInput = document.getElementById('ask-input')
    const askButton = document.getElementById('ask-button')
    const askResults = document.getElementById('ask-results')

    askForm.addEventListener('submit', async (event) => {
      event.preventDefault()
      const question = askInput.value.trim()

      if (!question) {
        askResults.innerHTML = '<p class="status error">Type a question first.</p>'
        return
      }

      askButton.disabled = true
      askResults.innerHTML = '<p class="status">Thinking…</p>'

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // Same ids events.js sends to /api/log, so the server can tie an ask to
          // a browser and a visit.
          // home_station: only the stop_id; the server checks it against `stops`.
          body: JSON.stringify({
            question, device_id: deviceId, session_id: sessionId, home_station: homeStation.stop_id,
          }),
        })
        const data = await res.json()

        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`)

        // Escape before inserting: the answer is model output, and raw
        // innerHTML with untrusted text is the shape of an XSS bug.
        const escapeHtml = (str) => str.replace(/[&<>"']/g, (c) => (
          { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ))

        const parts = [`<p class="answer">${escapeHtml(data.answer)}</p>`]

        // Show what the model actually looked up. This is the transparency
        // that makes the eval work possible later.
        if (data.toolCalls?.length) {
          // One line per tool call; formatToolCall knows each tool's input shape.
          parts.push('<p class="status">' +
            data.toolCalls.map(c => escapeHtml(formatToolCall(c))).join('<br>') + '</p>')
        } else {
          parts.push('<p class="status">Answered without searching.</p>')
        }

        askResults.innerHTML = parts.join('')
      } catch (err) {
        askResults.innerHTML = `<p class="status error">Error: ${err.message}</p>`
      } finally {
        askButton.disabled = false
      }
    })
  </script>
</body>
</html>
